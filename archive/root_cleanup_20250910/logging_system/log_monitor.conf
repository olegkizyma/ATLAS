# ATLAS Log Monitor Configuration
# Конфігурація системи моніторингу логів

# Директорії
LOG_DIR="../logs"
ARCHIVE_DIR="../logs/archive"

# Кольорова схема (0=вимкнено, 1=увімкнено)
ENABLE_COLORS=1

# Рівні логування для відображення
SHOW_DEBUG=1
SHOW_INFO=1
SHOW_WARNING=1
SHOW_ERROR=1
SHOW_CRITICAL=1

# Автоматичне архівування (розмір в MB)
AUTO_ARCHIVE_SIZE=50

# Кількість рядків для показу в статистиці
STATS_TAIL_LINES=100

# Фільтри для підсвітки (regex patterns)
ERROR_PATTERNS="ERROR|CRITICAL|Exception|Traceback|Failed|fail"
WARNING_PATTERNS="WARNING|WARN|deprecated"
INFO_PATTERNS="INFO|Starting|Started|Active|Success"
DEBUG_PATTERNS="DEBUG"

# Сервіси для моніторингу
SERVICES="frontend orchestrator tts_server goose recovery_bridge"

# Формат часових міток
TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"

# Максимальна довжина рядка для відображення
MAX_LINE_LENGTH=200

# Refresh interval для статистики (секунди)
STATS_REFRESH_INTERVAL=5
